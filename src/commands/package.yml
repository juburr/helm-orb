description: Packages a Helm chart.
parameters:
  app_version:
    type: string
    description: "Version of the service or application to install."
  chart_dir:
    type: string
    description: "Path to the chart directory, which contains the Chart.yaml file. Environment variables are expanded."
  chart_version:
    type: string
    description: "Version of the Helm chart itself."
  output_dir:
    type: string
    default: "."
    description: >
      Directory to write the packaged chart (.tgz file) to. It is created if it doesn't exist. Environment variables
      are expanded.
  package_env_var:
    type: env_var_name
    default: "HELM_PACKAGE"
    description: >
      Name of the environment variable this command sets, for later steps, to the absolute path of the packaged
      chart (.tgz file).
steps:
  - run:
      environment:
        PARAM_APP_VERSION: << parameters.app_version >>
        PARAM_CHART_DIR: << parameters.chart_dir >>
        PARAM_CHART_VERSION: << parameters.chart_version >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PACKAGE_ENV_VAR: << parameters.package_env_var >>
      name: Package Helm Chart
      command: <<include(scripts/package.sh)>>
