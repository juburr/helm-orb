name: Locate a packaged Helm chart
description: >
  Finds a packaged Helm chart (.tgz file) in a directory, such as one an
  earlier job uploaded as an artifact, and sets an environment variable,
  HELM_PACKAGE by default, to its absolute path for later steps. The GitHub
  Actions twin of the orb's locate_chart command.
author: juburr

inputs:
  chart_name:
    description: The chart name to filter the file results by (optional).
    default: ""
  chart_version:
    description: The version number to filter the file results by (optional).
    default: ""
  package_env_var:
    description: >
      Name of the environment variable this action sets, for later steps, to
      the absolute path of the packaged chart (.tgz file) it finds.
    default: HELM_PACKAGE
  search_dir:
    description: >
      Directory to search for the packaged chart (.tgz file). Subdirectories
      are not searched.
    default: "."

runs:
  using: composite
  steps:
    - name: Locate Helm Chart
      shell: bash
      env:
        PARAM_CHART_NAME: ${{ inputs.chart_name }}
        PARAM_CHART_VERSION: ${{ inputs.chart_version }}
        PARAM_PACKAGE_ENV_VAR: ${{ inputs.package_env_var }}
        PARAM_SEARCH_DIR: ${{ inputs.search_dir }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/locate_chart.sh"
