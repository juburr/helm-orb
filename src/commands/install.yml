description: Installs the helm binary. This command should be invoked prior to calling any other commands.
parameters:
  caching:
    type: boolean
    default: true
  install_path:
    type: string
    default: "/home/circleci/bin"
    description: Path to a binary directory not requiring root access (no trailing slash).
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 checksum verification of the downloaded Helm executable.
      "strict" (default) fails the step when the version has no checksum in this orb.
      "known_versions" verifies listed versions and installs unlisted versions without verification, printing a warning.
      "false" skips verification entirely (not recommended).
  version:
    type: string
    default: "4.3.0"
    description: Specify the semver of the Helm version to install.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The cached tarball is architecture-specific, so key it on the machine type as well.
        # {{ arch }} is avoided because it also encodes the CPU model, which fragments the cache.
        - run:
            name: Detect Helm Architecture
            command: uname -m > /tmp/helm-orb-cache-arch
        - restore_cache:
            key: helm-cache-<< parameters.version >>-{{ checksum "/tmp/helm-orb-cache-arch" }}
  - run:
      name: Install Helm
      environment:
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(scripts/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: helm-cache-<< parameters.version >>-{{ checksum "/tmp/helm-orb-cache-arch" }}
            paths:
              - helm.tar.gz
  - run:
      name: Cleanup Helm Install
      command: rm helm.tar.gz
