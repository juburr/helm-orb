description: >
  The `install` command is used to simplify installation of Helm.

usage:
  version: 2.1
  orbs:
    helm: juburr/helm-orb@1.0.0
  jobs:
    publish-chart:
      docker:
        - image: cimg/base:current-22.04
      steps:
        - checkout
        - helm/install:
            version: "4.3.0"
        - helm/package:
            app_version: 4.1.2
            chart_dir: helm/myapplication
            chart_version: 1.0.0
        - helm/registry_login:
            registry: ghcr.io
        - helm/push:
            chart: myapplication-1.0.0.tgz
            remote: oci://ghcr.io/organization/repository/helm-charts
        - helm/registry_logout:
            registry: ghcr.io
        # Names of the environment variables holding the credentials, which here
        # are the defaults. A url ending in "/" gets the chart's file name appended.
        - helm/upload:
            chart: myapplication-1.0.0.tgz
            username: HELM_REPO_USERNAME
            password: HELM_REPO_PASSWORD
            url: https://nexus-server.myorganization.net/repository/my-raw-repo/charts/
  workflows:
    use-my-orb:
      jobs:
        - publish-chart
