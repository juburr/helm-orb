version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  helm-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      # Run your orb's commands to validate them.
      - helm-orb/install
      - run:
          name: Verify Install
          command: command -v helm
  # push_raw sends credentials in request headers, so it must refuse anything but an https:// URL
  # without contacting the host.
  push-raw-test:
    docker:
      - image: cimg/base:current-22.04
    environment:
      NEXUS_USER: ci-user
      NEXUS_PASSWORD: ci-password
    steps:
      - checkout
      - run:
          name: push_raw Rejects Non-HTTPS Upload Paths
          command: |
            touch chart.tgz
            for UPLOAD_PATH in "http://nexus.example/charts/" "https-nexus.example/charts/" "nexus.example/charts/"; do
              if PARAM_CHART=chart.tgz PARAM_PASSWORD_ENV=NEXUS_PASSWORD PARAM_USERNAME_ENV=NEXUS_USER PARAM_UPLOAD_PATH="${UPLOAD_PATH}" \
                  bash src/scripts/push_raw.sh > push_raw.log 2>&1; then
                cat push_raw.log
                echo "FAIL: push_raw accepted ${UPLOAD_PATH}"
                exit 1
              fi
              if grep -q "Response code" push_raw.log; then
                cat push_raw.log
                echo "FAIL: push_raw contacted ${UPLOAD_PATH} before rejecting it"
                exit 1
              fi
              echo "PASS: rejected ${UPLOAD_PATH}"
            done

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - push-raw-test:
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/helm-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - push-raw-test
          context: orb-publishing
          filters: *release-filters
