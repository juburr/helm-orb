version: 2.1
orbs:
  # Your orb will be automatically injected here during the pipeline.
  # Reference your orb's jobs and commands below as they will exist when built.
  orb-tools: circleci/orb-tools@12.3
  # The orb definition is intentionally not included here. It will be injected into the pipeline.
  helm-orb: {}

# Use this tag to ensure test jobs always run,
# even though the downstream publish job will only run on release tags.
filters: &filters
  tags:
    only: /.*/

# Filter for release tags.
release-filters: &release-filters
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

jobs:
  # Create jobs to test the commands of your orbs.
  # You may want to add additional validation steps to ensure the commands are working as expected.
  command-test:
    docker:
      - image: cimg/base:current-22.04
    steps:
      - checkout
      # Repositories often keep charts in a top-level helm/ directory, as in this orb's usage example.
      # Install must not collide with it.
      - run:
          name: Create helm/ Chart Directory
          command: mkdir -p helm/myapplication && touch helm/myapplication/Chart.yaml
      # Run your orb's commands to validate them.
      - helm-orb/install
      - run:
          name: Verify Install
          command: |
            command -v helm
            helm version
            [[ -f helm/myapplication/Chart.yaml ]]
  # Runs install.sh under the verify_checksums default declared in install.yml against a real
  # Helm release that has no checksum in the lookup table (a 404 cannot explain a failure).
  checksum-test:
    docker:
      - image: cimg/base:current-22.04
    environment:
      UNLISTED_VERSION: 4.0.0-rc.1
    steps:
      - checkout
      - run:
          name: Unlisted Version Fails Closed By Default
          command: |
            REPO_DIR=$(pwd)
            DEFAULT_MODE=$(yq '.parameters.verify_checksums.default' src/commands/install.yml)
            echo "verify_checksums default: ${DEFAULT_MODE}"
            cd "$(mktemp -d)" && mkdir bin
            if PARAM_INSTALL_PATH="$(pwd)/bin" PARAM_VERIFY_CHECKSUMS="${DEFAULT_MODE}" PARAM_VERSION="${UNLISTED_VERSION}" \
                bash "${REPO_DIR}/src/scripts/install.sh"; then
              echo "FAIL: install succeeded for unlisted version ${UNLISTED_VERSION} under the default."
              exit 1
            fi
            if [[ -e helm.tar.gz || -e bin/helm ]]; then
              echo "FAIL: install downloaded or installed Helm before rejecting the unlisted version."
              exit 1
            fi
            echo "PASS: unlisted version ${UNLISTED_VERSION} failed closed before download."
      - run:
          name: known_versions Opt-Out Installs Unlisted Version
          command: |
            REPO_DIR=$(pwd)
            cd "$(mktemp -d)" && mkdir bin
            PARAM_INSTALL_PATH="$(pwd)/bin" PARAM_VERIFY_CHECKSUMS=known_versions PARAM_VERSION="${UNLISTED_VERSION}" \
              bash "${REPO_DIR}/src/scripts/install.sh" | tee install.log
            grep -q "WARN: No checksum available for version ${UNLISTED_VERSION}" install.log
            bin/helm version --short | grep -F "v${UNLISTED_VERSION}"
  # Installs on an Arm machine to confirm the arm64 build is selected and verified. The second
  # install restores the tarball cached by the first, covering the cache-hit path.
  arm64-test:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    steps:
      - helm-orb/install
      - helm-orb/install
      - run:
          name: Verify arm64 Install
          command: |
            if [[ "$(uname -m)" != "aarch64" ]]; then
              echo "FAIL: expected an aarch64 machine, got $(uname -m)."
              exit 1
            fi
            HELM_FILE_TYPE=$(file -L "$(command -v helm)")
            echo "${HELM_FILE_TYPE}"
            if [[ "${HELM_FILE_TYPE}" != *"ARM aarch64"* ]]; then
              echo "FAIL: the installed helm binary is not an arm64 build."
              exit 1
            fi
            helm version
  # Runs the orb's Helm commands (install, package, locate_chart, registry_login, push, registry_logout)
  # under one Helm version against a local registry:2 over plain HTTP. The workflow runs it for a
  # pinned Helm 3 release and for the install command's default (Helm 4).
  helm-conformance-test:
    parameters:
      helm_version:
        type: string
        description: Helm version to install, or "default" to use the install command's default version.
    docker:
      - image: cimg/base:current-22.04
      - image: registry:2
    environment:
      CHART_DIR: /tmp/conformance/testchart
      DIST_DIR: /tmp/conformance/dist
      REGISTRY_HOST: localhost:5000
      REGISTRY_USER: ci-user
      REGISTRY_PASSWORD: ci-password
    steps:
      - checkout
      - when:
          condition:
            equal: ["default", << parameters.helm_version >>]
          steps:
            - helm-orb/install
      - unless:
          condition:
            equal: ["default", << parameters.helm_version >>]
          steps:
            - helm-orb/install:
                version: << parameters.helm_version >>
      - run:
          name: Verify Helm Version
          command: |
            EXPECTED_VERSION="<< parameters.helm_version >>"
            if [[ "${EXPECTED_VERSION}" == "default" ]]; then
              EXPECTED_VERSION=$(yq '.parameters.version.default' src/commands/install.yml)
            fi
            ACTUAL_VERSION=$(helm version --template '{{ .Version }}')
            echo "Expected v${EXPECTED_VERSION}, installed ${ACTUAL_VERSION}"
            [[ "${ACTUAL_VERSION}" == "v${EXPECTED_VERSION}" ]]
      - run:
          name: Create And Lint Test Chart
          command: |
            mkdir -p "$(dirname "${CHART_DIR}")"
            helm create "${CHART_DIR}"
            helm lint --strict "${CHART_DIR}"
      - helm-orb/package:
          app_version: 1.2.3
          chart_directory: ${CHART_DIR}
          chart_version: 0.1.0
          output_directory: ${DIST_DIR}
      - helm-orb/locate_chart:
          chart_name: testchart
          chart_version: 0.1.0
          env_output_package: LOCATED_CHART
          search_directory: ${DIST_DIR}
      - run:
          name: Verify Packaged Chart
          command: |
            echo "HELM_PACKAGE=${HELM_PACKAGE}"
            echo "LOCATED_CHART=${LOCATED_CHART}"
            [[ "${HELM_PACKAGE}" == "${DIST_DIR}/testchart-0.1.0.tgz" ]]
            [[ "${LOCATED_CHART}" == "${HELM_PACKAGE}" ]]
            helm show chart "${HELM_PACKAGE}" | grep -x 'appVersion: 1.2.3'
      - run:
          name: Wait For Registry
          command: curl --silent --show-error --fail --retry 30 --retry-delay 1 --retry-connrefused "http://${REGISTRY_HOST}/v2/"
      - helm-orb/registry_login:
          registry: ${REGISTRY_HOST}
          username_env: REGISTRY_USER
          password_env: REGISTRY_PASSWORD
          plain_http: true
      - helm-orb/push:
          chart: ${LOCATED_CHART}
          registry: oci://${REGISTRY_HOST}/helm-orb-ci
          plain_http: true
      - run:
          name: Verify Pushed Chart
          command: |
            helm show chart --plain-http "oci://${REGISTRY_HOST}/helm-orb-ci/testchart" --version 0.1.0 | tee /tmp/pushed-chart.yaml
            grep -x 'version: 0.1.0' /tmp/pushed-chart.yaml
      - helm-orb/registry_logout:
          registry: ${REGISTRY_HOST}

workflows:
  test-deploy:
    jobs:
      # Make sure to include "filters: *filters" in every test job you want to run as part of your deployment.
      # Test your orb's commands in a custom job and test your orb's jobs directly as a part of this workflow.
      - command-test:
          filters: *filters
      - checksum-test:
          filters: *filters
      - arm64-test:
          filters: *filters
      - helm-conformance-test:
          name: helm-conformance-test-<< matrix.helm_version >>
          matrix:
            parameters:
              helm_version: ["3.22.0", "default"]
          filters: *filters
      # The orb must be re-packed for publishing, and saved to the workspace.
      - orb-tools/pack:
          filters: *release-filters
      - orb-tools/publish:
          orb_name: juburr/helm-orb
          vcs_type: << pipeline.project.type >>
          pub_type: production
          # Ensure this job requires all test jobs and the pack job.
          requires:
            - orb-tools/pack
            - command-test
            - checksum-test
            - arm64-test
            - helm-conformance-test
          context: orb-publishing
          filters: *release-filters
